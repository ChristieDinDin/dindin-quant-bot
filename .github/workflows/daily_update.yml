name: Daily Stock Data Update

on:
  schedule:
    # 22:00 UTC = after US market close (4PM ET) + buffer
    # Taiwan: next morning 6AM
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing the DB back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yfinance

      - name: Install dependencies
        run: |
          pip install --quiet pandas yfinance PyYAML

      - name: Fetch stock data (incremental)
        run: |
          python scripts/fetch_all_stocks.py
          echo "DB size: $(du -h data/database/market_data.db | cut -f1)"

      - name: Commit database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database/market_data.db
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "📈 Daily data update $(date +'%Y-%m-%d')"
            git push
            echo "✅ Database pushed to repo."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Daily Update — $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/database/market_data.db ]; then
            echo "**DB size:** $(du -h data/database/market_data.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
            sqlite3 data/database/market_data.db \
              "SELECT '**Stocks:** ' || COUNT(DISTINCT symbol) || ' | **Rows:** ' || COUNT(*) FROM daily_kline;" \
              >> $GITHUB_STEP_SUMMARY
          fi
