name: Daily Stock Data Update

on:
  schedule:
    # 06:30 UTC+8 = Taiwan morning before market open (22:30 UTC previous day)
    # Runs Mon–Fri; Taiwan market closes 13:30 CST = 05:30 UTC
    - cron: '30 22 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing the DB + YAML back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --quiet pandas yfinance PyYAML requests backtesting pandas_ta numpy

      # ── Step 1: Refresh stock list from TWSE + TPEX ─────────────────────
      # Runs daily so newly IPO'd stocks or volume changes are captured.
      # Only updates taiwan_stocks.yaml (high_volume section); no DB writes here.
      - name: Update stock list (≥20M TWD/day, append-only)
        run: |
          python scripts/update_stock_list.py --min-value 20 --stale-days 45
          echo "Stock list updated."

      # ── Step 2: Incremental OHLCV fetch ─────────────────────────────────
      # For symbols already in DB: fetches only missing days (~7-8 min for 900 stocks).
      # For NEW symbols (just added by step 1): auto-fetches 2 years history.
      - name: Fetch stock data (incremental)
        run: |
          python scripts/fetch_all_stocks.py
          echo "DB size: $(du -h data/database/market_data.db | cut -f1)"

      # ── Step 3: Chip data (三大法人 + 融資融券) ─────────────────────────
      - name: Fetch chip data
        run: |
          python scripts/fetch_chip_data.py --days 5
          echo "DB size after chip: $(du -h data/database/market_data.db | cut -f1)"

      # ── Step 4: Pre-build backtest cache ─────────────────────────────────
      # Runs all 3 strategies with default params. TTL = 36h (survives weekend).
      # When user opens Backtest Lab next morning, results load instantly.
      - name: Build backtest cache (all strategies, default params)
        run: |
          python scripts/run_backtest_cache.py --workers 2
          echo "DB size after cache: $(du -h data/database/market_data.db | cut -f1)"

      # ── Step 5: Paper trading daily scan ────────────────────────────────────
      # Runs divergence hunter on all DB symbols → opens/closes simulated positions
      # → saves data/paper_trading/state.json for the dashboard to display.
      - name: Run paper trading scan
        run: |
          python scripts/run_paper_trading_scan.py --initial-equity 70000 --max-positions 5

      # ── Step 6: Commit everything ─────────────────────────────────────────
      - name: Commit database and stock list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database/market_data.db data/taiwan_stocks.yaml data/paper_trading/state.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "📈 Daily update $(date +'%Y-%m-%d')"
            # Pull with rebase; for DB conflicts always keep our (Actions) version
            git pull --rebase -X ours || true
            git push
            echo "✅ Pushed to repo."
          fi

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## 📊 Daily Update — $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/database/market_data.db ]; then
            echo "**DB size:** $(du -h data/database/market_data.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
            sqlite3 data/database/market_data.db \
              "SELECT '**Stocks:** ' || COUNT(DISTINCT symbol) || ' | **Rows:** ' || COUNT(*) FROM daily_kline;" \
              >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/paper_trading/state.json ]; then
            python3 scripts/summarise_paper_state.py >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
